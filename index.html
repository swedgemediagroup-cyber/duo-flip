<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Duo Flip</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#f4f4f5;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
body{min-height:100dvh;touch-action:none}
.stage{position:fixed;inset:0;perspective:900px;background:#000}
.hinge{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center}
.screen{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.outer{background:linear-gradient(160deg,#14161c,#0b0c10 55%,#111318)}
.inner{background:linear-gradient(160deg,#1c2430,#0e1218 50%,#16202c);transform:rotateY(180deg)}
.chrome{position:absolute;inset:0;padding:max(54px,env(safe-area-inset-top)) 22px 28px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;font-size:13px;opacity:.72}
.hero{margin-top:36px;font-size:clamp(34px,10vw,48px);font-weight:650;letter-spacing:-.045em;line-height:.95}
.sub{margin-top:14px;color:#a1a1aa;font-size:16px;max-width:16em;line-height:1.4}
.cards{margin-top:auto;display:grid;gap:10px}
.card{border-radius:18px;padding:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
.card span{display:block;margin-top:4px;color:#a1a1aa;font-size:13px}
.rail{position:absolute;top:18%;right:10px;display:flex;flex-direction:column;gap:10px}
.dot{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08)}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 40%,rgba(0,0,0,.35));opacity:0}
#hud{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;text-align:center;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none}
</style>
</head>
<body>
<div id="hud"><span id="debug">0° drag</span><span>swipe right to open</span></div>
<div id="hint">Swipe across the screen</div>
<div class="stage" id="stage">
  <div class="hinge" id="hinge">
    <section class="screen outer" id="outer">
      <div class="chrome">
        <div class="row"><span>9:41</span><span>5G</span></div>
        <div class="hero">Outer<br>display</div>
        <p class="sub">Closed phone. Swipe right like you are opening a book.</p>
        <div class="cards">
          <div class="card"><strong>Messages</strong><span>See you at 7.</span></div>
          <div class="card"><strong>Weather</strong><span>Salt Lake · 68°</span></div>
        </div>
      </div>
      <div class="veil" id="outerVeil"></div>
    </section>
    <section class="screen inner" id="inner">
      <div class="chrome">
        <div class="row"><span>9:41</span><span>Duo</span></div>
        <div class="hero">Inner<br>canvas</div>
        <p class="sub">Opened. Same language, more room.</p>
        <div class="cards">
          <div class="card"><strong>Split view</strong><span>Mail + Notes</span></div>
          <div class="card"><strong>Continuity</strong><span>The fold is the interface</span></div>
        </div>
      </div>
      <div class="rail"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="veil" id="innerVeil"></div>
    </section>
  </div>
</div>
<script>
const hinge=document.getElementById('hinge');
const debugEl=document.getElementById('debug');
const outerVeil=document.getElementById('outerVeil');
const innerVeil=document.getElementById('innerVeil');
const stage=document.getElementById('stage');
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
let fold=0;
function applyFold(deg){
  fold=clamp(deg,0,180);
  hinge.style.transform='rotateY('+fold+'deg)';
  const o=clamp(fold/90,0,1), i=clamp((180-fold)/90,0,1);
  document.getElementById('outer').style.filter='blur('+(o*18)+'px) brightness('+(1-o*.35)+')';
  document.getElementById('inner').style.filter='blur('+(i*18)+'px) brightness('+(1-i*.25)+')';
  outerVeil.style.opacity=String(o*.7);
  innerVeil.style.opacity=String(i*.55);
  debugEl.textContent=fold.toFixed(0)+'\u00b0';
}
applyFold(0);
let dragging=false,startX=0,startFold=0;
function posX(e){return (e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)}
stage.addEventListener('touchstart',e=>{dragging=true;startX=posX(e);startFold=fold;},{passive:true});
stage.addEventListener('mousedown',e=>{dragging=true;startX=posX(e);startFold=fold;});
function move(e){
  if(!dragging)return;
  const dx=posX(e)-startX;
  applyFold(startFold+(dx/window.innerWidth)*180);
}
window.addEventListener('touchmove',move,{passive:true});
window.addEventListener('mousemove',move);
window.addEventListener('touchend',()=>dragging=false);
window.addEventListener('mouseup',()=>dragging=false);
</script>
</body>
</html>
